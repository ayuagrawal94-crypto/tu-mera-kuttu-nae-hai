<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Prank</title>
    <style>
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; background-color: #ffe6e6; overflow: hidden; margin: 0; }
        h1 { color: #d63384; text-align: center; padding: 0 20px; }
        .buttons { position: relative; width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; }
        button { padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 12px; border: none; position: absolute; }
        #yesBtn { background-color: #28a745; color: white; transform: translateX(-70px); }
        #noBtn { background-color: #dc3545; color: white; transform: translateX(70px); transition: 0.1s; z-index: 10; }
    </style>
</head>
<body>

    <h1 id="question">Do you love me?</h1>
    <div class="buttons">
        <button id="yesBtn" onclick="sayYes()">Yes</button>
        <button id="noBtn" onmouseover="moveButton()" onclick="moveButton()">No</button>
    </div>

    <script>
        function moveButton() {
            // This makes the 'No' button jump to a random spot
            const x = Math.random() * (window.innerWidth - 120);
            const y = Math.random() * (window.innerHeight - 50);
            const noBtn = document.getElementById('noBtn');
            noBtn.style.position = 'fixed';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';
        }

        function sayYes() {
            // Changes the text when 'Yes' is clicked
            document.getElementById('question').innerHTML = "I knew it! ❤️ <br> tu mera kuttu nae hai";
            document.querySelector('.buttons').style.display = 'none';
        }
    </script>
</body>
</html>
